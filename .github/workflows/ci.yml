name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11 --no-audit --no-fund

      - run: npm ci --no-audit --no-fund

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start (docker compose up)
        run: docker compose up --build --detach --wait --wait-timeout 60

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:3000

          check_page() {
            local path="$1"
            local body
            body=$(curl -fsS "$base$path")
            grep -q 'id="__nuxt"' <<<"$body" || { echo "No SPA root on $path"; exit 1; }
            echo "OK  $path"
          }

          check_page /
          check_page /notes/does-not-exist

          asset=$(curl -fsS "$base/" | grep -oE '/_nuxt/[^"]+\.js' | head -n 1)
          test -n "$asset" || { echo "No JS asset found in index.html"; exit 1; }
          curl -fsS -o /dev/null "$base$asset"
          echo "OK  $asset"

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down
